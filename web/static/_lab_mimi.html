<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mimi – Varianten</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { margin: 16px; background: #1a1510; color: #eadcc0; font-family: system-ui, sans-serif; }
  h1 { font-size: 1.1rem; color: #c8a15a; letter-spacing: 1px; margin: 0 0 12px; }
  .reihe { display: flex; flex-wrap: wrap; gap: 16px; }
  .muster { width: 250px; border-radius: 14px; overflow: hidden; border: 1px solid #4a3a26; }
  .buehne { height: 190px; display: flex; align-items: flex-end; justify-content: center; gap: 18px; padding-bottom: 14px; }
  .hell { background: #eadcbd; }
  .dunkel { background: #221b2b; }
  .gross { width: 190px; }
  .klein { width: 72px; }          /* etwa Spielgröße (96 px) */
  .gross svg, .klein svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .text { padding: 10px 12px; background: #2a2118; }
  .text b { color: #eec24a; }
  .text p { margin: 4px 0 0; font-size: .85rem; color: #c6ac82; }
  /* Die Spiel-Animationen (Schwanz, Umhang/Flügel) auch hier laufen lassen */
</style>
</head>
<body>
<h1>MIMI · DESIGN-VARIANTEN</h1>
<div class="reihe" id="reihe"></div>
<script src="/static/mimi.js"></script>
<script>
// Alle Varianten: Seitenansicht nach rechts, viewBox 0 -24 106 94, Beine y 40–58.
// Gleiche Klassen wie im Spiel (mi-tail, mi-leg-*, mi-head, mi-eyes, mi-cape),
// damit Laufen/Schlafen/Springen ohne Änderung weiter funktionieren.
const VB = 'viewBox="0 -24 106 94" xmlns="http://www.w3.org/2000/svg"';
const fleck = (x, y, r, farbe, w = 0) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.72}" transform="rotate(${w} ${x} ${y})" fill="${farbe}" opacity="0.85"/>`;
const bein = (cls, x, farbe, rand, pfote, hoehe = 18, breite = 6.4, y = 40, L = 1.3) => `<g class="mi-leg ${cls}">
  <rect x="${x}" y="${y}" width="${breite}" height="${hoehe}" rx="${breite / 2}" fill="${farbe}" stroke="${rand}" stroke-width="${L}"/>
  <ellipse cx="${x + breite / 2 + 0.2}" cy="${y + hoehe - 0.4}" rx="${breite * 0.64}" ry="2.3" fill="${pfote}" stroke="${rand}" stroke-width="${L * 0.8}"/></g>`;

// A · aktuell (Stand im Spiel)
function varianteA() {
  const FELL = "#eaa954", FELL2 = "#dc9433", HELL = "#f8d9a0", RAND = "#8f5a1c", FLECK = "#3a2710", SP = "#22170c", AUGE = "#79ea5f", ROSA = "#e59a8f";
  return `<svg ${VB}>
    <g class="mi-tail"><path d="M25,31 C12,27 8,14 13,2 C17,-8 26,-11 30,-6 C25,-5 21,1 22,9 C23,18 28,22 30,27 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <path d="M14,-1 q3,-3 7,-1 M13,6 q4,-2 8,0 M15,14 q4,-1 7,1" stroke="${SP}" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
    ${bein("mi-leg-b1", 25, FELL2, RAND, HELL)}${bein("mi-leg-f1", 58, FELL2, RAND, HELL)}
    <ellipse cx="46" cy="32" rx="29" ry="14" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
    <ellipse cx="50" cy="39" rx="20" ry="6.5" fill="${HELL}" opacity=".9"/>
    ${fleck(32, 27, 2.2, FLECK, 20)}${fleck(40, 24, 1.9, FLECK)}${fleck(36, 35, 1.8, FLECK)}${fleck(46, 29, 1.7, FLECK)}${fleck(55, 27, 1.8, FLECK)}
    ${bein("mi-leg-b2", 34, FELL, RAND, HELL)}${bein("mi-leg-f2", 66, FELL, RAND, HELL)}
    <g class="mi-cape"><path d="M66,20 C60,15 50,15 42,17 C36,19 33,24 34,30 L37,27 L39,33 L43,28 L46,34 L50,28 L54,33 L57,27 C62,26 66,24 66,20 Z" fill="#a82a22" stroke="#65150f" stroke-width="1.3"/>
      <circle cx="65" cy="21" r="2.3" fill="#e8c25a" stroke="#8a6a2f" stroke-width=".8"/></g>
    <g class="mi-head">
      <path d="M68,12 L66,-3 L76,6 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M69,8 L68,0 L73,5 Z" fill="${ROSA}"/>
      <path d="M86,11 L92,-3 L81,5 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M86,7 L90,0 L83,4 Z" fill="${ROSA}"/>
      <circle cx="79" cy="21" r="14.5" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <ellipse cx="88" cy="27" rx="7.5" ry="5.5" fill="${HELL}"/>
      <g class="mi-eyes"><path d="M79,20 Q84,14 89,20 Q84,25 79,20 Z" fill="${AUGE}" stroke="#2e4a22" stroke-width=".8"/><ellipse cx="84.4" cy="20" rx="1.1" ry="3.6" fill="#132010"/><circle cx="86" cy="18.4" r=".9" fill="#fff"/></g>
      <path d="M93.4,24.6 l2.6,1.4 -2.6,1.2 Z" fill="#c9675a"/>
      <path d="M90,25 l12,-2 M90,27 l12,1 M89,29 l11,3" stroke="#fff5e2" stroke-width=".6"/>
    </g></svg>`;
}

// B · Kätzchen (Chibi): riesiger Kopf, großes Auge, kurze Beine, Streifen, Halstuch
function varianteB() {
  const FELL = "#f0a54e", RAND = "#9a5a1a", STREIF = "#c9711f", HELL = "#fbe2b8", AUGE = "#5fd46b";
  return `<svg ${VB}>
    <g class="mi-tail"><path d="M28,38 C14,36 10,24 16,16 C20,10 28,12 26,18 C22,20 22,26 30,32 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <path d="M17,20 q3,-1 5,1 M19,27 q3,-1 4,2" stroke="${STREIF}" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    ${bein("mi-leg-b1", 30, "#e39743", RAND, HELL, 13, 7, 44)}${bein("mi-leg-f1", 52, "#e39743", RAND, HELL, 13, 7, 44)}
    <ellipse cx="44" cy="40" rx="20" ry="11" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
    <ellipse cx="46" cy="45" rx="13" ry="4.5" fill="${HELL}"/>
    <path d="M34,31 q2,5 0,9 M41,30 q2,5 0,9 M48,30 q2,5 0,9" stroke="${STREIF}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${bein("mi-leg-b2", 37, FELL, RAND, HELL, 13, 7, 44)}${bein("mi-leg-f2", 58, FELL, RAND, HELL, 13, 7, 44)}
    <g class="mi-cape"><path d="M58,30 C62,34 70,34 74,30 L72,38 L66,35 L60,40 Z" fill="#c73a2e" stroke="#7c2016" stroke-width="1.1"/></g>
    <g class="mi-head">
      <path d="M58,6 L56,-14 L70,-2 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M59,1 L58,-9 L65,-3 Z" fill="#f2a79b"/>
      <path d="M86,4 L94,-14 L78,-3 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M86,-1 L91,-9 L81,-3 Z" fill="#f2a79b"/>
      <circle cx="74" cy="12" r="21" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <path d="M66,-6 q1,5 -1,9 M73,-8 q1,5 -1,9 M80,-6 q1,5 -1,8" stroke="${STREIF}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="85" cy="21" rx="10" ry="7.5" fill="${HELL}"/>
      <g class="mi-eyes"><ellipse cx="82" cy="10" rx="5.2" ry="6.4" fill="${AUGE}" stroke="#264a22" stroke-width=".9"/>
        <ellipse cx="82.8" cy="10.6" rx="2.6" ry="4.4" fill="#10200e"/><circle cx="84.4" cy="7.6" r="1.6" fill="#fff"/><circle cx="81.4" cy="13" r=".8" fill="#fff"/></g>
      <ellipse cx="78" cy="19" rx="3.4" ry="2" fill="#f28a86" opacity=".55"/>
      <path d="M93.6,17.6 l2.8,1.2 -2.6,1.6 Z" fill="#d86a62"/>
      <path d="M95,20.6 q-1.5,2.6 -4,1.8 M95,20.6 q0,2.8 -2,3.6" stroke="#6b3d1f" stroke-width=".9" fill="none" stroke-linecap="round"/>
      <path d="M90,19 l13,-3 M90,21 l13,0 M89,23 l12,3" stroke="#fff5e2" stroke-width=".6"/>
    </g></svg>`;
}

// C · Luftpiratin: Serval mit Fliegerbrille auf der Stirn und flatterndem Schal (Sundered Skies!)
function varianteC() {
  const FELL = "#e5a24c", FELL2 = "#d28c30", HELL = "#f7d8a2", RAND = "#86541a", FLECK = "#33230e", SP = "#22170c", AUGE = "#79ea5f", MESSING = "#c99a3c";
  return `<svg ${VB}>
    <g class="mi-tail"><path d="M24,30 C10,28 4,16 8,4 C11,-4 20,-7 23,-2 C18,-1 15,5 16,12 C17,20 24,23 27,26 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <path d="M9,2 q3,-3 7,-1 M8,9 q4,-2 8,0 M11,17 q4,-1 7,1" stroke="${SP}" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
    ${bein("mi-leg-b1", 25, FELL2, RAND, HELL)}${bein("mi-leg-f1", 58, FELL2, RAND, HELL)}
    <ellipse cx="46" cy="32" rx="29" ry="13.5" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
    <ellipse cx="50" cy="39" rx="20" ry="6" fill="${HELL}" opacity=".9"/>
    ${fleck(28, 28, 2.1, FLECK, 20)}${fleck(36, 24, 1.8, FLECK)}${fleck(33, 34, 1.7, FLECK)}${fleck(43, 28, 1.7, FLECK)}${fleck(51, 25, 1.6, FLECK)}${fleck(56, 31, 1.5, FLECK)}${fleck(41, 35, 1.4, FLECK)}
    ${bein("mi-leg-b2", 34, FELL, RAND, HELL)}${bein("mi-leg-f2", 66, FELL, RAND, HELL)}
    <g class="mi-cape"><path d="M66,26 C58,22 48,18 38,14 L40,19 L33,17 L38,22 L31,23 C42,27 56,30 66,30 Z" fill="#b8352a" stroke="#6d1a12" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M64,24 C68,25 70,29 68,32 C64,33 62,30 64,24 Z" fill="#b8352a" stroke="#6d1a12" stroke-width="1"/></g>
    <g class="mi-head">
      <path d="M68,12 L66,-3 L76,6 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M69,8 L68,0 L73,5 Z" fill="#e59a8f"/>
      <path d="M86,11 L92,-3 L81,5 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M86,7 L90,0 L83,4 Z" fill="#e59a8f"/>
      <circle cx="79" cy="21" r="14.5" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <ellipse cx="88" cy="27" rx="7.5" ry="5.5" fill="${HELL}"/>
      <path d="M65.5,15 C72,9 84,8 92.5,13" stroke="#5a3a1e" stroke-width="3" fill="none"/>
      <circle cx="76" cy="10" r="4.6" fill="#9fd4e0" stroke="${MESSING}" stroke-width="2"/><circle cx="86" cy="10.5" r="4.6" fill="#9fd4e0" stroke="${MESSING}" stroke-width="2"/>
      <path d="M74.5,8 l2,-1.5 M84.5,8.5 l2,-1.5" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".9"/>
      <g class="mi-eyes"><path d="M79,21 Q84,16 89,21 Q84,25.5 79,21 Z" fill="${AUGE}" stroke="#2e4a22" stroke-width=".8"/><ellipse cx="84.4" cy="21" rx="1.1" ry="3.4" fill="#132010"/><circle cx="86" cy="19.5" r=".9" fill="#fff"/></g>
      <path d="M93.4,24.6 l2.6,1.4 -2.6,1.2 Z" fill="#c9675a"/>
      <path d="M95,27.4 q-2,3 -5,2.4" stroke="#6b3d1f" stroke-width=".9" fill="none" stroke-linecap="round"/>
      <path d="M90,25 l12,-2 M90,27 l12,1 M89,29 l11,3" stroke="#fff5e2" stroke-width=".6"/>
    </g></svg>`;
}

// D · Nebelkatze: schlanke dunkle Katze, leuchtend grüne Augen, Goldhalsband
function varianteD() {
  const FELL = "#34303d", FELL2 = "#29252f", RAND = "#141118", HELL = "#4a4556", AUGE = "#9cff6a", GOLD = "#d9b24e";
  return `<svg ${VB}>
    <g class="mi-tail"><path d="M22,30 C8,30 2,18 6,6 C9,-3 17,-8 21,-4 C16,-2 12,4 13,12 C14,20 20,24 24,26 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.2"/></g>
    ${bein("mi-leg-b1", 26, FELL2, RAND, FELL2, 19, 5.6)}${bein("mi-leg-f1", 58, FELL2, RAND, FELL2, 19, 5.6)}
    <path d="M18,30 C22,21 38,19 52,21 C62,22 68,26 68,32 C68,38 60,42 46,42 C30,42 17,39 18,30 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.2"/>
    <path d="M24,27 C34,21 50,21 62,24" stroke="#8e7fb0" stroke-width="1.1" fill="none" opacity=".55"/>
    ${bein("mi-leg-b2", 34, FELL, RAND, FELL, 19, 5.6)}${bein("mi-leg-f2", 65, FELL, RAND, FELL, 19, 5.6)}
    <g class="mi-head">
      <path d="M69,11 L68,-6 L78,5 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.2"/><path d="M70,7 L69.5,-1 L74,4 Z" fill="#6a4f6e"/>
      <path d="M86,10 L91,-6 L81,4 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.2"/><path d="M86,6 L89,-1 L83,3 Z" fill="#6a4f6e"/>
      <path d="M66,24 C64,12 72,6 80,6 C90,6 96,14 97,22 C98,28 94,33 86,34 C76,35 67,32 66,24 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.2"/>
      <path d="M72,10 C78,7 86,7 91,11" stroke="#8e7fb0" stroke-width="1" fill="none" opacity=".5"/>
      <g class="mi-eyes"><path d="M80,19 Q85.5,13 91,19 Q85.5,24 80,19 Z" fill="${AUGE}"/><ellipse cx="86" cy="19" rx="1" ry="3.8" fill="#0c140a"/>
        <path d="M80,19 Q85.5,13 91,19 Q85.5,24 80,19 Z" fill="none" stroke="${AUGE}" stroke-width="3" opacity=".25"/><circle cx="87.6" cy="17.4" r=".9" fill="#fff"/></g>
      <path d="M95.5,24 l2.2,1.2 -2.2,1 Z" fill="#b78aa0"/>
      <path d="M90,26 l12,-2 M90,28 l12,1" stroke="#c9c2d6" stroke-width=".5"/>
    </g>
    <g class="mi-cape"><path d="M64,33 C68,36 74,37 78,35" stroke="${GOLD}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="71" cy="37.6" r="2.2" fill="${GOLD}" stroke="#8a6a2f" stroke-width=".7"/></g>
  </svg>`;
}

// E · Himmelskatze: Serval mit kleinen Federflügeln (Himmelsinseln) statt Umhang
function varianteE() {
  const FELL = "#eaa954", FELL2 = "#dc9433", HELL = "#f8d9a0", RAND = "#8f5a1c", FLECK = "#3a2710", SP = "#22170c", AUGE = "#79ea5f", FEDER = "#f7f1e3", FEDER2 = "#cfc2a6";
  const feder = (d) => `<path d="${d}" fill="${FEDER}" stroke="${FEDER2}" stroke-width="1"/>`;
  return `<svg ${VB}>
    <g class="mi-tail"><path d="M25,31 C12,27 8,14 13,2 C17,-8 26,-11 30,-6 C25,-5 21,1 22,9 C23,18 28,22 30,27 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <path d="M14,-1 q3,-3 7,-1 M13,6 q4,-2 8,0 M15,14 q4,-1 7,1" stroke="${SP}" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
    ${bein("mi-leg-b1", 25, FELL2, RAND, HELL)}${bein("mi-leg-f1", 58, FELL2, RAND, HELL)}
    <ellipse cx="46" cy="32" rx="29" ry="14" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
    <ellipse cx="50" cy="39" rx="20" ry="6.5" fill="${HELL}" opacity=".9"/>
    ${fleck(32, 30, 2.2, FLECK, 20)}${fleck(36, 36, 1.8, FLECK)}${fleck(46, 34, 1.7, FLECK)}${fleck(28, 35, 1.5, FLECK)}
    ${bein("mi-leg-b2", 34, FELL, RAND, HELL)}${bein("mi-leg-f2", 66, FELL, RAND, HELL)}
    <g class="mi-cape">
      ${feder("M56,22 C48,6 34,-2 22,2 C30,6 34,10 36,14 C30,12 24,13 20,17 C28,18 33,20 36,23 C31,24 27,27 26,30 C36,30 48,28 56,22 Z")}
      <path d="M52,21 C44,12 36,8 28,6 M50,22 C42,17 34,16 26,17 M48,24 C42,24 36,26 30,28" stroke="${FEDER2}" stroke-width=".8" fill="none"/>
    </g>
    <g class="mi-head">
      <path d="M68,12 L66,-3 L76,6 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M69,8 L68,0 L73,5 Z" fill="#e59a8f"/>
      <path d="M86,11 L92,-3 L81,5 Z" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/><path d="M86,7 L90,0 L83,4 Z" fill="#e59a8f"/>
      <circle cx="79" cy="21" r="14.5" fill="${FELL}" stroke="${RAND}" stroke-width="1.3"/>
      <ellipse cx="88" cy="27" rx="7.5" ry="5.5" fill="${HELL}"/>
      ${fleck(72, 13, 1.5, FLECK)}${fleck(78, 10, 1.4, FLECK)}${fleck(70, 21, 1.3, FLECK)}
      <g class="mi-eyes"><path d="M79,20 Q84,14 89,20 Q84,25 79,20 Z" fill="${AUGE}" stroke="#2e4a22" stroke-width=".8"/><ellipse cx="84.4" cy="20" rx="1.1" ry="3.6" fill="#132010"/><circle cx="86" cy="18.4" r=".9" fill="#fff"/></g>
      <path d="M93.4,24.6 l2.6,1.4 -2.6,1.2 Z" fill="#c9675a"/>
      <path d="M95,27.4 q-2,3 -5,2.4" stroke="#6b3d1f" stroke-width=".9" fill="none" stroke-linecap="round"/>
      <path d="M90,25 l12,-2 M90,27 l12,1 M89,29 l11,3" stroke="#fff5e2" stroke-width=".6"/>
    </g></svg>`;
}

// Aktueller Stand aus dem Spiel: gestreifte Mimi in allen Fellfarben (mimi.js).
const felle = window.MIMI_FELLE ? Object.entries(window.MIMI_FELLE).map(([k, f]) =>
  [`Gestreift · ${f.name}`, "So läuft Mimi jetzt im Spiel – nur die Fellfarbe unterscheidet sich.", () => window.mimiBild(k)]) : [];
const varianten = [...felle,
  ["A · Aktuell", "Serval mit kurzem Umhang (Stand jetzt).", varianteA],
  ["B · Kätzchen", "Niedlich: großer Kopf, großes Auge, kurze Beine, Streifen, rotes Halstuch.", varianteB],
  ["C · Luftpiratin", "Serval mit Fliegerbrille und flatterndem Schal – passend zu Luftschiffen.", varianteC],
  ["D · Nebelkatze", "Schlank und dunkel, leuchtend grüne Augen, Goldhalsband – geheimnisvoll.", varianteD],
  ["E · Himmelskatze", "Serval mit kleinen Federflügeln – eine Katze der Himmelsinseln.", varianteE],
];
document.getElementById("reihe").innerHTML = varianten.map(([name, text, fn]) => `<div class="muster">
    <div class="buehne hell"><div class="gross">${fn()}</div></div>
    <div class="buehne dunkel" style="height:110px"><div class="klein">${fn()}</div><div class="klein" style="transform:scaleX(-1)">${fn()}</div></div>
    <div class="text"><b>${name}</b><p>${text}</p></div></div>`).join("");
</script>
</body>
</html>
