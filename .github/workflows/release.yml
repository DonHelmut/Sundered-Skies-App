# Release automatisch nach dem Merge – damit Kalle nicht mehr für jedes
# Release „go“ schreiben muss (25.11.2026). Der Merge des PRs IST die Freigabe.
#
# Ablauf: Läuft bei jedem Push auf main. Gibt es den Tag v<APP_VERSION> schon,
# passiert nichts (normale Merges ohne Versionssprung). Ist die Version neu:
# Versionsstellen + RELEASE.md prüfen, Server-Tests, beide .spec bauen,
# Paket packen, Rauchtest mit der gepackten exe, Tag + Release mit Zip.
#
# Ein PR, der ein Release werden soll, zählt also selbst die Version hoch
# (paths.py, app.js, ?v= in index.html/tv.html, START-HIER.txt) und schreibt
# RELEASE.md. Kein Direkt-Push auf main mehr nötig.
#
# Probelauf: In PRs, die diesen Workflow oder .github/release ändern, läuft
# alles außer dem Hochladen; das Zip liegt dann als Artefakt am Lauf.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release/**
  workflow_dispatch:

permissions:
  contents: write

# Zwei Merges kurz hintereinander sollen nicht gleichzeitig dasselbe Release bauen.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PROBE: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - name: Ist die Version neu?
        id: neu
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'^APP_VERSION\s*=\s*\"([^\"]+)\"',open('server/paths.py',encoding='utf-8').read(),re.M).group(1))")
          if [ "$PROBE" != "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v gibt es schon – kein Release."
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          else
            echo "bauen=true" >> "$GITHUB_OUTPUT"
          fi

      # Gleiche Python- und PyInstaller-Version wie auf dem Jonsbo, mit dem
      # bisher alle Pakete gebaut wurden.
      - uses: actions/setup-python@v6
        if: steps.neu.outputs.bauen == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Versionsstellen und RELEASE.md prüfen
        if: steps.neu.outputs.bauen == 'true'
        id: info
        run: python .github/release/release.py pruefen

      - name: Abhängigkeiten
        if: steps.neu.outputs.bauen == 'true'
        run: python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.22.3

      # Nur die schnellen Server-Tests; die Browser-Tests laufen schon im
      # Tests-Workflow am PR.
      - name: Server-Tests
        if: steps.neu.outputs.bauen == 'true'
        run: python -m pytest --ignore=tests/browser -q

      - name: App und Updater bauen
        if: steps.neu.outputs.bauen == 'true'
        run: |
          python -m PyInstaller SunderedSkiesInitiative-Ordner.spec --noconfirm --clean
          python -m PyInstaller Aktualisieren.spec --noconfirm --clean

      - name: Paket packen
        if: steps.neu.outputs.bauen == 'true'
        run: python .github/release/release.py paket

      - name: Rauchtest mit der gepackten App
        if: steps.neu.outputs.bauen == 'true'
        run: python .github/release/release.py rauch

      - name: Probelauf – Zip als Artefakt
        if: steps.neu.outputs.bauen == 'true' && env.PROBE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SunderedSkies-App-probe
          path: |
            dist/paket/SunderedSkies-App.zip
            dist/notes.md
          retention-days: 3

      - name: Release veröffentlichen
        if: steps.neu.outputs.bauen == 'true' && env.PROBE != 'true'
        shell: bash
        # Titel über env statt direkt im Skript: Anführungszeichen im Titel
        # würden sonst den Befehl zerlegen.
        env:
          TAG: ${{ steps.info.outputs.tag }}
          TITEL: ${{ steps.info.outputs.titel }}
        run: |
          gh release create "$TAG" \
            "dist/paket/SunderedSkies-App.zip#SunderedSkies-App.zip (fertiges Paket)" \
            --target "$GITHUB_SHA" \
            --title "$TITEL" \
            --notes-file dist/notes.md
